name: Deploy to Hostinger
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        env:
          VITE_INSTAGRAM_TOKEN: ${{ secrets.VITE_INSTAGRAM_TOKEN }}
          VITE_INSTAGRAM_ACCOUNT_ID: ${{ secrets.VITE_INSTAGRAM_ACCOUNT_ID }}
        run: bun run build
      - name: Copy logos to dist
        run: |
          mkdir -p dist/logos
          cp public/logos/*.png dist/logos/
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      - name: Deploy via rsync
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" rsync -avz --delete \
            -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            dist/ \
            u641304150@212.85.6.3:/home/u641304150/domains/celsaoautopecas.com/public_html/
